<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitor Price Tracker</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --good:           #0ca30c;
    --good-bg:        #e6f6e6;
    --critical:       #d03b3b;
    --critical-bg:    #fbeaea;
    --warning:        #fab219;
    --series-1:       #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;
      --good-bg:        #123a12;
      --critical:       #e66767;
      --critical-bg:    #3a1a1a;
      --warning:        #c98500;
      --series-1:       #3987e5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --good:           #0ca30c;
    --good-bg:        #123a12;
    --critical:       #e66767;
    --critical-bg:    #3a1a1a;
    --warning:        #c98500;
    --series-1:       #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .viz-root { padding: 28px 20px 60px; max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; }
  .meta-row {
    display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px;
    font-size: 13px; color: var(--text-secondary);
  }
  .meta-row strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .controls {
    display: flex; gap: 10px; align-items: center; margin: 18px 0 14px;
    flex-wrap: wrap;
  }
  .controls input[type="text"] {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px;
    min-width: 220px;
  }
  .controls label {
    font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-1);
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 720px; }
  thead th {
    text-align: left; padding: 10px 12px; font-weight: 600;
    color: var(--text-secondary); border-bottom: 1px solid var(--gridline);
    white-space: nowrap; position: sticky; top: 0; background: var(--surface-1);
  }
  thead th.retailer-col { text-align: center; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--series-1) 6%, transparent); }

  .product-name { font-weight: 600; }
  .product-sku { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .cell { text-align: center; min-width: 118px; }
  .price { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
  .cell.cheapest .price-pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--good-bg); color: var(--good); font-weight: 700;
  }
  .sub { display: block; color: var(--text-muted); font-size: 11px; margin-top: 3px; }
  .rating { color: var(--text-secondary); }
  .oos { color: var(--critical); }
  .dash { color: var(--text-muted); }
  .na-cell { color: var(--text-muted); font-size: 12px; }

  a.plink { color: inherit; text-decoration: none; }
  a.plink:hover .price { text-decoration: underline; }

  footer { margin-top: 18px; font-size: 12px; color: var(--text-muted); }
  .error-box {
    margin-top: 16px; padding: 14px 16px; border: 1px solid var(--critical);
    background: var(--critical-bg); color: var(--critical); border-radius: 8px; font-size: 13px;
  }
  .error-box code {
    background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 4px; font-size: 12px;
  }
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <h1>Competitor Price Tracker</h1>
    <div class="subtitle">Cheapest retailer per product is highlighted in green. Data loaded from <code>results.json</code>.</div>
    <div class="meta-row" id="metaRow"></div>
  </header>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Filter products…">
    <label><input type="checkbox" id="hideNA"> Hide unavailable prices</label>
  </div>

  <div class="table-wrap">
    <table id="priceTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>

  <div id="errorBox"></div>

  <footer id="footerNote"></footer>
</div>

<script>
async function main() {
  const metaRow = document.getElementById('metaRow');
  const errorBox = document.getElementById('errorBox');
  let results;
  try {
    const res = await fetch('results.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    results = await res.json();
  } catch (e) {
    errorBox.innerHTML = '<div class="error-box">' +
      'Could not load <code>results.json</code> (' + e.message + '). ' +
      'If you opened this file directly (file://), your browser may block local fetches. ' +
      'Serve this folder with a local server instead, e.g.: <code>python3 -m http.server 8000</code> ' +
      'then open <code>http://localhost:8000/dashboard.html</code>.' +
      '</div>';
    return;
  }

  // Group by product, preserving first-seen order
  const productOrder = [];
  const bySku = new Map();
  for (const row of results) {
    if (!bySku.has(row.sku_id)) {
      bySku.set(row.sku_id, { sku_id: row.sku_id, product: row.product, rows: {} });
      productOrder.push(row.sku_id);
    }
    bySku.get(row.sku_id).rows[row.retailer] = row;
  }

  // Column order: fixed known retailers first, then any others alphabetically
  const preferredOrder = ['amazon', 'bestbuy', 'target', 'walmart', 'newegg'];
  const seenRetailers = new Set(results.map(r => r.retailer));
  const retailers = [
    ...preferredOrder.filter(r => seenRetailers.has(r)),
    ...[...seenRetailers].filter(r => !preferredOrder.includes(r)).sort()
  ];

  const headRow = document.getElementById('headRow');
  headRow.innerHTML = '<th>Product</th>' +
    retailers.map(r => `<th class="retailer-col">${cap(r)}</th>`).join('');

  const bodyRows = document.getElementById('bodyRows');

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function render(filterText, hideNA) {
    bodyRows.innerHTML = '';
    const q = (filterText || '').trim().toLowerCase();

    for (const skuId of productOrder) {
      const p = bySku.get(skuId);
      if (q && !p.product.toLowerCase().includes(q)) continue;

      const cellsForRow = retailers.map(r => p.rows[r]);
      const prices = cellsForRow
        .filter(c => c && typeof c.price === 'number')
        .map(c => c.price);
      const minPrice = prices.length ? Math.min(...prices) : null;

      if (hideNA && prices.length === 0) continue;

      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.innerHTML = `<div class="product-name">${escapeHtml(p.product)}</div><div class="product-sku">${skuId}</div>`;
      tr.appendChild(nameTd);

      for (const r of retailers) {
        const c = p.rows[r];
        const td = document.createElement('td');
        td.className = 'cell';
        if (!c) {
          td.innerHTML = '<span class="dash">—</span>';
          tr.appendChild(td);
          continue;
        }
        if (typeof c.price !== 'number') {
          td.classList.add('na-cell');
          td.innerHTML = `<span class="dash">—</span><span class="sub">${escapeHtml(c.status || 'no data')}</span>`;
          tr.appendChild(td);
          continue;
        }
        const isCheapest = minPrice !== null && c.price === minPrice;
        if (isCheapest) td.classList.add('cheapest');

        const availLower = (c.availability || '').toLowerCase();
        const isOOS = availLower.includes('out of stock') || availLower.includes('unavailable') || availLower.includes('sold out');

        const priceHtml = isCheapest
          ? `<span class="price-pill">$${c.price.toFixed(2)}</span>`
          : `<span class="price">$${c.price.toFixed(2)}</span>`;

        const availHtml = c.availability
          ? `<span class="sub ${isOOS ? 'oos' : ''}">${escapeHtml(c.availability)}</span>`
          : '';
        const ratingHtml = (typeof c.rating === 'number')
          ? `<span class="sub rating">★ ${c.rating.toFixed(1)}</span>`
          : '';

        td.innerHTML = `<a class="plink" href="${escapeAttr(c.url)}" target="_blank" rel="noopener">${priceHtml}</a>${availHtml}${ratingHtml}`;
        tr.appendChild(td);
      }
      bodyRows.appendChild(tr);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  const okCount = results.filter(r => r.status === 'ok').length;
  metaRow.innerHTML =
    `<span><strong>${bySku.size}</strong> products</span>` +
    `<span><strong>${retailers.length}</strong> retailers</span>` +
    `<span><strong>${results.length}</strong> pages tracked</span>` +
    `<span><strong>${okCount}</strong> / ${results.length} fully collected</span>`;

  document.getElementById('footerNote').textContent =
    'Loaded ' + new Date().toLocaleString() + ' · run track_prices.py to refresh results.json';

  const searchBox = document.getElementById('searchBox');
  const hideNA = document.getElementById('hideNA');
  searchBox.addEventListener('input', () => render(searchBox.value, hideNA.checked));
  hideNA.addEventListener('change', () => render(searchBox.value, hideNA.checked));

  render('', false);
}
main();
</script>
</body>
</html>
